  <title>Toppmen.com – Página para hombres morbosos 🔥</title>

  <style>
    body {
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background: #000;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
    }
    .ads {
      margin: 20px auto;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .card {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }
    .card p {
      padding: 10px;
      font-size: 16px;
      margin: 0;
    }
    footer {
      margin: 30px 0;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
