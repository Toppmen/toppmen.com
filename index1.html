<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Toppmen - Verga y Placer sin Filtro</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Banner */
    header {
      background: linear-gradient(to right, #ff6600, #ff0000);
      padding: 25px;
      text-align: center;
      border-bottom: 4px solid #f90;
    }
    header h1 {
      color: white;
      font-size: 36px;
      margin: 0;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
    }

    /* Contenido */
    main {
      padding: 20px;
    }

    /* Anuncios */
    .ad {
      text-align: center;
      margin: 30px 0;
    }

    /* Galería de videos */
    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      justify-content: center;
    }
    .video-box {
      background: #222;
      border-radius: 12px;
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .video-box:hover {
      transform: scale(1.05);
      box-shadow: 0px 6px 20px rgba(0,0,0,0.6);
    }
    .video-box img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }
    .video-box h2 {
      font-size: 16px;
      margin: 12px 8px;
      color: #ff8800;
    }
  </style>
</head>
<body>

  <!-- Banner -->
  <header>
    <h1>🔥 Toppmen - Placer Crudo y Sin Vergüenza 🔥</h1>
  </header>

  <main>
    <!-- Anuncio superior -->
    <div class="ad">
      <script type="application/javascript" src="https://a.exoclick.com/tag.php?id=5647482"></script>
    </div>

    <!-- Galería de videos -->
    <div class="videos">
      <div class="video-box">
        <a href="video1.html">
          <img src="thumb1.jpg" alt="Comiendo verga apelito">
          <h2>🍆 Comiendo verga apelito</h2>
        </a>
      </div>
      <div class="video-box">
        <a href="video2.html">
          <img src="thumb2.jpg" alt="Cabalgando verga como loca">
          <h2>🔥 Cabalgando verga como loca</h2>
        </a>
      </div>
      <div class="video-box">
        <a href="video3.html">
          <img src="thumb3.jpg" alt="Buscando verga en el centro comercial">
          <h2>🔎 Buscando verga en el centro comercial</h2>
        </a>
      </div>
      <div class="video-box">
        <a href="video4.html">
          <img src="thumb4.jpg" alt="Reventando el chochito de una tragona">
          <h2>💥 Reventando el chochito de una tragona</h2>
        </a>
      </div>
      <div class="video-box">
        <a href="video5.html">
          <img src="thumb5.jpg" alt="Esperando verga en faldita">
          <h2>😈 Esperando verga en faldita</h2>
        </a>
      </div>
      <div class="video-box">
        <a href="video6.html">
          <img src="thumb6.jpg" alt="¿Me das verga? Ella sí lo hizo…">
          <h2>😏 ¿Me das verga? Ella sí lo hizo…</h2>
        </a>
      </div>
    </div>

    <!-- Anuncio inferior -->
    <div class="ad">
      <script type="application/javascript" src="https://a.exoclick.com/tag.php?id=5647482"></script>
    </div>
  </main>

</body>
</html>
